inputs: []
outputs:
  report: schedule.report
nodes:
  auth:
    inputs:
      redirect_uri: urn:ietf:wg:oauth:2.0:oob
    outputs:
      - access_token
      - refresh_token
      - expires_in
      - token_type
    provider: hex-backup.auth
  schedule_config:
    inputs: {}
    outputs: [src_folder, dst_folder, daily_time]
    provider: hex-backup.schedule_config
  schedule:
    inputs:
      src_folder: schedule_config.src_folder
      dst_folder: schedule_config.dst_folder
      daily_time: schedule_config.daily_time
      token: auth.access_token
    outputs: [report]
    provider: hex-backup.schedule
