inputs: []
outputs:
  report: save_files.report
nodes:
  config:
    inputs: {}
    outputs: [src_folder, dst_folder]
    provider: hexmod-backup.config
  auth:
    inputs:
      redirect_uri: https://tryhexbox.com/callback
    outputs:
      - access_token
      - refresh_token
      - expires_in
      - token_type
    provider: hexmod-backup.auth
  list_files:
    inputs:
      token: auth.access_token
      path: BackMeUp
    outputs:
      - files
    provider: hexmod-backup.list_files
  read_files:
    inputs:
      token: auth.access_token
      files: list_files.files
    outputs: [files_content]
    provider: hexmod-backup.read_files
  save_files:
    inputs:
      files_content: read_files.files_content
      dst_folder: config.dst_folder
    outputs: [report]
    provider: hexmod-backup.save_files
