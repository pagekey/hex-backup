inputs: []
outputs:
  files: list_files.files
nodes:
  get_client_id:
    provider: hexmod-backup.get_env
    inputs:
      key: GOOGLE_OAUTH_CLIENT_ID
    outputs:
      - value
  get_client_secret:
    provider: hexmod-backup.get_env
    inputs:
      key: GOOGLE_OAUTH_CLIENT_SECRET
    outputs:
      - value
  auth_read:
    provider: hexmod-backup.auth_read
    inputs: {}
    outputs:
      - refresh_token
  get_access_token:
    provider: hexmod-backup.get_access_token
    inputs:
      client_id: get_client_id.value
      client_secret: get_client_secret.value
      refresh_token: auth_read.refresh_token
    outputs:
      - access_token
  list_files:
    provider: hexmod-backup.list_files
    inputs:
      access_token: get_access_token.access_token
      path: .
      directories_only: 'true'
      names_only: 'true'
    outputs:
      - files
