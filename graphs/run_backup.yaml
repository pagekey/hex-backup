inputs: [src_folder, dst_folder, refresh_token]
outputs: {}
nodes:
  get_access_token:
    inputs:
      refresh_token: root.refresh_token
    outputs:
      - access_token
    provider: hexmod-backup.get_access_token
  list_files:
    inputs:
      access_token: get_access_token.access_token
      path: root.src_folder
    outputs:
      - files
    provider: hexmod-backup.list_files
  read_files:
    inputs:
      access_token: get_access_token.access_token
      files: list_files.files
    outputs: [files_content]
    provider: hexmod-backup.read_files
  save_files:
    inputs:
      files_content: read_files.files_content
      dst_folder: root.dst_folder
    outputs: [report]
    provider: hexmod-backup.save_files
