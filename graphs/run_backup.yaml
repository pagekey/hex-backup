inputs: [src_folder, dst_folder]
outputs: {}
nodes:
  auth_read:
    provider: hexmod-backup.auth_read
    inputs: {}
    outputs:
      - client_id
      - client_secret
      - refresh_token
  get_access_token:
    provider: hexmod-backup.get_access_token
    inputs:
      client_id: auth_read.client_id
      client_secret: auth_read.client_secret
      refresh_token: auth_read.refresh_token
    outputs:
      - access_token
  list_files:
    inputs:
      access_token: get_access_token.access_token
      path: root.src_folder
    outputs:
      - files
    provider: hexmod-backup.list_files
  read_files:
    inputs:
      access_token: get_access_token.access_token
      files: list_files.files
    outputs: [files_content]
    provider: hexmod-backup.read_files
  save_files:
    inputs:
      files_content: read_files.files_content
      dst_folder: root.dst_folder
    outputs: [report]
    provider: hexmod-backup.save_files
