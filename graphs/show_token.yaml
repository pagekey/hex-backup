inputs: []
outputs:
  refresh_token: auth_filter.refresh_token
  token_status: auth_filter.token_status
  secrets_path: auth_filter.secrets_path
nodes:
  auth_read:
    provider: hexmod-backup.auth:read
    inputs: {}
    outputs:
      - client_id
      - client_secret
      - refresh_token
  auth_filter:
    provider: hexmod-backup.auth:filter
    inputs:
      refresh_token: auth_read.refresh_token
    outputs:
      - refresh_token
      - token_status
      - secrets_path
