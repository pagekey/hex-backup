inputs: []
outputs:
  secrets_path: auth_write.secrets_path
nodes:
  auth:
    provider: hexmod-backup.auth:run
    inputs:
      redirect_uri: https://tryhexbox.com/callback
    outputs:
      - access_token
      - refresh_token
      - expires_in
      - token_type
  auth_write:
    provider: hexmod-backup.auth:write
    inputs:
      refresh_token: auth.refresh_token
    outputs:
      - secrets_path
