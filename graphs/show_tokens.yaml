inputs: []
outputs:
  client_id: filter_keys.client_id
  client_secret: filter_keys.client_secret
nodes:
  get_client_id:
    inputs:
      key: GOOGLE_OAUTH_CLIENT_ID
    outputs:
      - value
    provider: hexmod-backup.get_env
  get_client_secret:
    inputs:
      key: GOOGLE_OAUTH_CLIENT_SECRET
    outputs:
      - value
    provider: hexmod-backup.get_env
  filter_keys:
    inputs:
      client_id: get_client_id.value
      client_secret: get_client_secret.value
    outputs:
      - client_id
      - client_secret
    provider: hexmod-backup.filter_keys
