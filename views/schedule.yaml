title: "Schedule Backup"

effects: []

layout:
  - type: button
    text: Back
    on_click:
      view: hexmod-backup.home

  - type: label
    text: Use the button below to schedule a backup.

  - type: text-field
    id: txtSource
    label: Source folder (in Google Drive)

  - type: text-field
    id: txtDestination
    label: Local destination folder


  - type: button
    text: "Schedule"
    on_click:
      graph:
        id: hexmod-backup.run_backup
        inputs:
          src_folder: id:txtSource
          dst_folder: id:txtDestination
