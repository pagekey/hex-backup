title: "Schedule Backup"

description: Schedule a daily backup - set it and forget it!

top_level: true

effects: []

layout:
  - type: label
    text: 1. Click below to make sure your token is set.

  - type: button
    text: "Show Token"
    on_click:
      graph:
        id: hexmod-backup.show_token
        inputs: {}

  - type: label
    text: graph:hexmod-backup.show_token:refresh_token

  - type: label
    text: 2. If the above tokens are not set, you must authorize.

  - type: button
    text: "Authorize"
    on_click:
      graph:
        id: hexmod-backup.auth
        inputs: {}

  - type: label
    text: If you run the above, the path to the creds will appear below.

  - type: label
    text: graph:hexmod-backup.auth:secrets_path

  - type: label
    text: 4. Load the folders using the button below.

  - type: button
    text: "Load folders"
    on_click:
      graph:
        id: hexmod-backup.load_folders
        inputs: {}

  - type: label
    text: 5. Use the button below to schedule a backup.

  - type: dropdown
    id: txtSource
    label: Source folder (in Google Drive)
    choices: graph:hexmod-backup.load_folders:files

  - type: text-field
    id: txtDestination
    label: Local destination folder

  - type: text-field
    id: txtDailyTime
    label: Daily Time (HH:MM)

  - type: button
    text: "Schedule"
    on_click:
      graph:
        id: hexmod-backup.schedule
        inputs:
          src_folder: id:txtSource
          dst_folder: id:txtDestination
          daily_time: id:txtDailyTime

  - type: label
    text: graph:hexmod-backup.schedule:report
