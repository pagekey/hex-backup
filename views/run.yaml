title: "Run Backup"

description: Back up your Google Drive to a local folder for safekeeping.

top_level: true

effects:
  - graph: hexmod-backup.show_token

layout:
  - type: label
    text: Before we get started, let's make sure you're logged into Google Drive.

  - type: container
    visible_when: 
      path: "hexmod-backup.show_token:token_status"
      is: "active"
    children:
      - type: label
        text: You're already logged in.
      - type: label
        text: Click Next to continue.
      - type: button
        text: Next
        on_click:
          view: hexmod-backup.run2

  - type: container
    visible_when: 
      path: "hexmod-backup.show_token:token_status"
      is: "not set"
    children:
      - type: label
        text: 1. Click the button below to login.

      - type: button
        text: "Authorize"
        on_click:
          graph:
            id: hexmod-backup.auth
            inputs: {}

      - type: label
        text: 2. Refresh the page when you're done.
