title: "Run Backup"

effects: []

layout:
  - type: button
    text: Back
    on_click:
      view: hexmod-backup.home

  - type: label
    text: 1. Click below to make sure your token is set.

  - type: button
    text: "Show Token"
    on_click:
      graph:
        id: hexmod-backup.show_token
        inputs: {}

  - type: label
    text: graph:hexmod-backup.show_token:refresh_token

  - type: label
    text: 2. If the above tokens are not set, you must authorize.

  - type: button
    text: "Authorize"
    on_click:
      graph:
        id: hexmod-backup.auth
        inputs: {}

  - type: label
    text: If you run the above, the path to the creds will appear below.

  - type: label
    text: graph:hexmod-backup.auth:secrets_path

  - type: label
    text: 3. Load the folders using the button below.

  - type: button
    text: "Load folders"
    on_click:
      graph:
        id: hexmod-backup.load_folders
        inputs: {}

  - type: label
    text: "4. Fill out the source and desintation of your backup."

  - type: dropdown
    id: txtSource
    label: Source folder (in Google Drive)
    choices: graph:hexmod-backup.load_folders:files

  - type: text-field
    id: txtDestination
    label: Local destination folder

  - type: button
    text: "Run Backup"
    on_click:
      graph:
        id: hexmod-backup.run_backup
        inputs:
          src_folder: id:txtSource
          dst_folder: id:txtDestination

  - type: label
    text: graph:hexmod-backup.run_backup:report
